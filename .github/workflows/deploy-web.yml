# Publie le front Flutter sur GitHub Pages à chaque push sur main.
# Réglages du dépôt requis (une fois) : Settings → Pages → Source : « GitHub Actions ».
#
# DOMAIN : mets ton nom de domaine (ex. dzairshipping.com) pour servir le site
# dessus — vide, le site vit sur https://koceilaidir.github.io/Dzair-shipping/.
# API_URL : l'URL publique de l'API sur Render (…/api à la fin).
name: Déployer le front (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOMAIN: ""                                     # ← ton domaine ici (ex. dzairshipping.com)
  API_URL: "https://dzair-shipping-api.onrender.com/api"   # ← l'URL Render de l'API

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Flutter web
        run: |
          if [ -n "$DOMAIN" ]; then BASE="/"; else BASE="/Dzair-shipping/"; fi
          echo "base-href = $BASE"
          flutter pub get
          flutter build web --release \
            --base-href "$BASE" \
            --dart-define=API_URL="$API_URL" \
            --dart-define=FLUTTER_WEB_CANVASKIT_URL="${BASE}canvaskit/"

      - name: Domaine personnalisé (CNAME)
        if: env.DOMAIN != ''
        run: echo "$DOMAIN" > build/web/CNAME

      # GitHub Pages sert les 404 avec ce fichier : indispensable pour qu'un
      # rafraîchissement sur une route Flutter ne casse pas.
      - name: Fallback SPA
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
