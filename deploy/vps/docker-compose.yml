services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dzair
      POSTGRES_USER: dzair
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dzair -d dzair"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ../../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dzair:${DB_PASSWORD}@db:5432/dzair
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: https://dzairshipping.com,https://www.dzairshipping.com
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - api

volumes:
  dbdata:
  caddydata:
  caddyconfig:
